{% extends "base.html" %}
{% block title %}Sign up · StegoShare{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" action="{{ url_for('auth.signup_submit') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="display_name">Display name</label>
  <input id="display_name" name="display_name" type="text"
         value="{{ display_name or '' }}" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username"
         value="{{ email or '' }}" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password"
         autocomplete="new-password" minlength="12" required>
  <p class="hint">At least 12 characters.</p>
  <p><button class="primary" type="submit">Sign up</button></p>
</form>
{% endblock %}
