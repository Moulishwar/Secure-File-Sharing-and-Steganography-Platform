[project]
name = "stegoshare"
version = "0.1.0"
description = "Secure file and text sharing: AEAD-encrypted payloads carried in images"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.1",
    "flask-wtf>=1.2",          # CSRF protection on every form
    "flask-limiter>=4.1",      # brute-force protection on auth routes
    "argon2-cffi>=25.1",       # password hashing (OWASP Argon2id)
    "cryptography>=50.0",      # AES-256-GCM envelope encryption
    "pillow>=12.0",            # cover image decode/encode
    "numpy>=2.3",              # embedding engine
    "filetype>=1.2",           # content-based type sniffing, no libmagic dependency
    "reedsolo>=1.7",         # Reed-Solomon corruption tolerance for the capsule
    "python-dotenv>=1.2.3",  # flask run loads .env by itself
]

[project.scripts]
stegoshare-init = "stegoshare.cli:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stegoshare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
